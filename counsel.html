<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice of Hope - Rose of Sharon Parish | Intermediary Hub: Jesus Tribe</title>
    <link rel="shortcut icon" type="image/x-icon" href="rccg-logo.png">
    <style>
        :root {
            --primary-color: #291672;
            --dark-text: #333;
            --light-text: #fff;
            --background-light: #f9f9f9;
            --background-accent: #eef5ee;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            line-height: 1.6;
            color: var(--dark-text);
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* Header */
        header {
            padding: 15px 0;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo img {
            height: 50px;
        }
        
        .logo h1 {
            font-size: 24px;
            color: var(--dark-text);
            font-weight: 600;
        }
        
        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }
        
        nav a {
            text-decoration: none;
            color: var(--dark-text);
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        nav a:hover {
            color: var(--primary-color);
        }
        
        .cta-button {
            background-color: var(--primary-color);
            color: var(--light-text);
            padding: 10px 20px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .cta-button:hover {
            background-color: #1a0274;
        }
        
        /* Hero Section */
        .hero {
            padding: 60px 0;
            background-color: var(--background-light);
            display: flex;
            align-items: center;
            min-height: 500px;
        }
        
        .hero-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 40px;
        }
        
        .hero-text {
            flex: 1;
        }
        
        .hero-image {
            flex: 1;
            text-align: right;
        }
        
        .hero-image img {
            width: 100%;
            max-width: 500px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .hero h2 {
            font-size: 48px;
            line-height: 1.2;
            margin-bottom: 20px;
        }
        
        .hero h2 span {
            color: var(--primary-color);
        }
        
        .hero p {
            font-size: 18px;
            margin-bottom: 30px;
            color: #666;
        }
        
        .secondary-button {
            display: inline-flex;
            align-items: center;
            margin-left: 20px;
            text-decoration: none;
            color: var(--dark-text);
            font-weight: 500;
        }
        
        .secondary-button svg {
            margin-right: 8px;
            fill: var(--primary-color);
        }
        
        /* Connect With Us Section */
        .connect-section {
            padding: 80px 0;
            background-color: var(--background-accent);
            text-align: center;
        }
        
        .connect-section h2 {
            font-size: 36px;
            margin-bottom: 30px;
        }
        
        .connect-options {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 40px;
        }
        
        .connect-card {
            background-color: #fff;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            width: 300px;
            text-align: center;
        }
        
        .connect-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        
        .connect-card .icon {
            background-color: var(--background-accent);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        
        .connect-card .icon svg {
            width: 40px;
            height: 40px;
            fill: var(--primary-color);
        }
        
        .connect-card h3 {
            font-size: 20px;
            margin-bottom: 15px;
        }
        
        .connect-card p {
            margin-bottom: 20px;
            color: #666;
        }
        
        .connect-button {
            display: inline-block;
            padding: 10px 20px;
            background-color: var(--primary-color);
            color: var(--light-text);
            text-decoration: none;
            border-radius: 4px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .connect-button:hover {
            background-color: #6aa16b;
        }
        
        /* Help Section */
        .help-section {
            padding: 80px 0;
            text-align: center;
        }
        
        .help-section h2 {
            font-size: 36px;
            margin-bottom: 20px;
        }
        
        .help-section p {
            max-width: 700px;
            margin: 0 auto;
            color: #666;
        }
        
        /* Footer */
        footer {
            background-color: #333;
            color: #fff;
            padding: 40px 0;
        }
        
        .social-links {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .social-links a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background-color: rgba(255,255,255,0.1);
            border-radius: 50%;
            transition: all 0.3s ease;
        }
        
        .social-links a:hover {
            background-color: var(--primary-color);
        }
        
        .social-links svg {
            width: 20px;
            height: 20px;
            fill: #fff;
        }
        
        .footer-content {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 40px;
        }
        
        .footer-column {
            flex: 1;
            min-width: 200px;
        }
        
        .footer-column h3 {
            margin-bottom: 20px;
            font-size: 18px;
        }
        
        .footer-column ul {
            list-style: none;
        }
        
        .footer-column li {
            margin-bottom: 10px;
        }
        
        .footer-column a {
            color: #ccc;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .footer-column a:hover {
            color: #fff;
        }
        
        .copyright {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            color: #aaa;
            font-size: 14px;
        }
        
        @media (max-width: 768px) {
            nav ul {
                display: none;
            }
            
            .hero-content {
                flex-direction: column;
                text-align: center;
            }
            
            .hero-image {
                order: -1;
            }
            
            .connect-options {
                flex-direction: column;
                align-items: center;
            }
            
            .connect-card {
                width: 100%;
                max-width: 350px;
            }
            
            .footer-content {
                flex-direction: column;
                gap: 30px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-content">
            <div class="logo">
                <img src="images/rccg_single.png" alt="">
                <h1 style="font-size: 17px;">Rose of Sharon Parish</h1>
            </div>
            <nav>
                
            </nav>
            <a href="index.html" class="cta-button">Go Back Home</a>
        </div>
    </header>

    <section class="hero">
        <div class="container hero-content">
            <div class="hero-text">
                <h2>Changing <span>The Way</span> You Experience Life</h2>
                <p>Yes, let's talk. We specialize in conversations about mental health, emotional and your personal wellness.</p>
                <a href="counsel_choice.html" class="cta-button">Book A Conversation</a>
                
            </div>
            <div class="hero-image">
                <img src="images/counsell_.png" alt="counsellors">
            </div>
        </div>
    </section>

    

   
</body>
</html>
