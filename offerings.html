<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offerings and Donations - Rose of Sharon Parish | Intermediary Hub: Jesus Tribe</title>

    <!-- favicons
    ================================================== -->
    <link rel="shortcut icon" type="image/x-icon" href="rccg-logo.png">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
            background-color: #111049;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fffedf;
        }
        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 90%;
            padding: 20px;
            box-sizing: border-box;
        }
        .verse {
            font-size: clamp(16px, 5vw, 24px);
            line-height: 1.4;
            margin-bottom: 20px;
            animation: pulse 2s infinite ease-in-out;
        }
        .reference {
            font-size: clamp(14px, 4vw, 18px);
            font-style: italic;
            margin-bottom: 30px;
        }
        .loader {
            width: 200px;
            height: 4px;
            background-color: #fffedf;
            overflow: hidden;
            position: relative;
        }
        .loader::after {
            content: '';
            display: block;
            width: 40%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.2);
            position: absolute;
            left: -40%;
            animation: loading 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }
        @keyframes loading {
            0% { left: -40%; }
            100% { left: 100%; }
        }
        @keyframes fadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="verse">“So let each one give as he purposes in his heart, not grudgingly or of necessity; for God loves a cheerful giver.”</div>
        <div class="reference">2 Corinthians 9:7 (NKJV)</div>
    </div>
    
    <script>
        // Fade out and redirect after animation
        setTimeout(() => {
            document.body.style.animation = 'fadeOut 0.5s ease-out forwards';
            setTimeout(() => {
                window.location.href = "give.html";
            }, 500);
        }, 4000);
    </script>
</body>
</html>
